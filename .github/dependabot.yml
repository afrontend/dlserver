version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # 새 버전은 기본 3일 기다린 뒤 올린다. dongnelibrary 는 직접 배포하는 패키지라 바로 받는다
    cooldown:
      exclude: ["dongnelibrary"]
    groups:
      # react 와 react-dom 은 버전이 정확히 같아야 한다 (따로 올리면 테스트가 실패한다)
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      dev-dependencies:
        dependency-type: development
    # 메이저 업그레이드는 따로 진행한다
    # - @types/node: package.json engines 의 Node 22 에 맞춘다
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
